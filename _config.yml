title: Christian's Notebook
include: ["_pages"]
exclude: ["_includes/notes_graph.json", "gems"]
# You may need to change the base URL depending on your deploy configuration.
baseurl: ""

# If you are using a host that cannot resolve URLs that do
# not end with .html (such as Neocities), set this to 'true'.
use_html_extension: false

# Set to `true` to open non-internal links in new tabs, or
# set to `false` to open non-internal links in current tab.
open_external_links_in_new_tab: true

# Set to `true` to replace tweet URLs with Twitter embeds.
# Note that doing so will negatively the reader's privacy
# as their browser will communicate with Twitter's servers.
embed_tweets: false

permalink: pretty
relative_permalinks: false

plugins:
  - jekyll-last-modified-at

sass:
  sass_dir: _sass
  style: :compressed

collections:
  notes:
    output: true
    permalink: /:slug

defaults:
  - scope:
      path: "**/*"
    values:
      layout: "default"
  - scope:
      path: "_notes/**/*.md"
    values:
      layout: "note"

graph_options:
  exclude:
    - "_notes/references"
    - "_notes/references/"
    - "_notes/references/*"
    - "_notes/references/**"
    - "/_notes/references"
    - "/_notes/references/"
    - "/_notes/references/*"
    - "/_notes/references/**"
    - "**/references/**"
    - "**/references/*"

# Fallback image for link previews (X, LinkedIn, iMessage, Slack, WhatsApp).
# Any page can override it with `image:` in its front matter.
default_image: /assets/home_photos/IMG_8265.JPG

description: "Christian Levan — Growth at NationGraph in Toronto. Writing about startups, building, and everything in between."

url: "https://chrislevan.me"
