<head>
  <meta charset="UTF-8" />

  <!-- Resolve the theme before first paint so there's no light/dark flash. -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("theme");
        var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.setAttribute(
          "data-theme",
          stored || (dark ? "dark" : "light")
        );
      } catch (e) {}
    })();
  </script>

  <link rel="canonical" href="{{ site.url }}{{ page.url }}" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta
    name="description"
    content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 | escape }}{% else %}{{ site.title | escape }}{% endif %}"
  />

  <meta property="og:site_name" content="{{ site.title }}" />

  <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml;charset=utf-8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>"
  />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=Geist+Mono:wght@400&display=swap"
  />

  <link rel="stylesheet" href="{{ site.baseurl }}/styles.css" />

  {% if page.excerpt %}
  <meta
    property="og:description"
    content="{{ page.excerpt | strip_html | strip_newlines | truncate: 160 | escape }}"
  />
  {% else %}
  <meta
    property="og:description"
    content="{{ site.title | strip_html | strip_newlines | truncate: 160 | escape }}"
  />
  {% endif %} {% if page.title %}
  <meta property="og:title" content="{{ page.title | escape }}" />
  <meta property="og:type" content="article" />
  {% else %}
  <meta property="og:title" content="{{ site.title }}" />
  <meta property="og:type" content="website" />
  {% endif %} {% if page.date %}
  <meta
    property="article:published_time"
    content="{{ page.date | date_to_xmlschema }}"
  />
  <meta property="article:author" content="{{ site.url }}/" />
  {% endif %}

  <meta property="og:url" content="{{ site.url }}{{ page.url }}" />

  {% if page.image %}
  <meta property="og:image" content="{{ site.url }}{{ page.image }}" />
  {% endif %}

  <title>
    {% if page.id == "home" %} {{ site.title }} {% else %} {{ page.title }}
    &mdash; {{ site.title }} {% endif %}
  </title>
</head>
