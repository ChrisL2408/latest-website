<!DOCTYPE html>
<html lang="en">
  <head>
    {% include head.html %}
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="{% if page.title %}{{ page.title | escape }}{% else %}{{ site.title | escape }}{% endif %}"
    />
    <meta
      name="twitter:description"
      content="{% if page.description %}{{ page.description | escape }}{% else %}{{ page.content | strip_html | strip_newlines | truncatewords: 50 | escape }}{% endif %}"
    />
    <meta
      name="twitter:image"
      content="{{ site.url }}{{ page.image | default: site.default_image }}"
    />
    <meta
      name="twitter:image:alt"
      content="{% if page.image_alt %}{{ page.image_alt | escape }}{% else %}{{ page.title | escape }}{% endif %}"
    />
  </head>
  <body>
    <div class="page{% if page.layout == 'note' %} page--article{% endif %}">
      {% include nav.html %}
      <main class="content">
        {{ content }} {% include footer.html %}
      </main>
    </div>

    <button
      class="theme-toggle"
      type="button"
      aria-label="Toggle light and dark theme"
      title="Toggle light and dark theme"
    >
      <svg
        class="icon-moon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
      </svg>
      <svg
        class="icon-sun"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <circle cx="12" cy="12" r="4" />
        <path
          d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"
        />
      </svg>
    </button>

    <script>
      (function () {
        var root = document.documentElement;
        var button = document.querySelector(".theme-toggle");
        if (!button) return;
        button.addEventListener("click", function () {
          var next =
            root.getAttribute("data-theme") === "dark" ? "light" : "dark";
          root.setAttribute("data-theme", next);
          try {
            localStorage.setItem("theme", next);
          } catch (e) {}
        });
      })();
    </script>

    {% include link-previews.html wrapperQuerySelector="main" %}
  </body>
</html>
