<!DOCTYPE html>
<html lang="en">
  <head>
    {% include head.html %}
    <!-- Open Graph tags -->
    <meta
      property="og:title"
      content="{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}"
    />
    <meta
      property="og:description"
      content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}"
    />
    <meta
      property="og:image"
      content="{% if page.path contains '555.md' %}{{ site.url }}/assets/555_photos/IMG_4036_compressed.jpg{% else %}{{ site.url }}/assets/IMG_8265_compressed.JPG{% endif %}"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="{{ site.url }}{{ page.url }}" />
    <meta property="og:type" content="article" />

    <!-- Twitter Card tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="{% if page.path contains '555.md' %}555 Night: Montreal's Creative Show & Tell | {{ site.title }}{% else %}{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}{% endif %}"
    />
    <meta
      name="twitter:description"
      content="{% if page.path contains '555.md' %}A cozy night of passion projects, homemade chai, and creative minds coming together in Montreal. 8 amazing presenters sharing their unique obsessions and ideas.{% else %}{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 200 }}{% else %}{{ site.description }}{% endif %}{% endif %}"
    />
    <meta
      name="twitter:image"
      content="{% if page.path contains '555.md' %}{{ site.url }}/assets/555_photos/IMG_4036_compressed.jpg{% else %}{{ site.url }}/assets/IMG_8265_compressed.JPG{% endif %}"
    />
    <meta name="twitter:creator" content="@christianlvn" />
  </head>
  <body>
    <nav>{% include nav.html %}</nav>
    <div class="wrapper">
      <main>{{ content }}</main>
      {% include footer.html %}
    </div>

    {% include link-previews.html wrapperQuerySelector="content" %}
  </body>
</html>
