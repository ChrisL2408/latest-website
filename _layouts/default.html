<!DOCTYPE html>
<html lang="en">
  <head>
    {% include head.html %}
    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}"
    />
    <meta
      name="twitter:description"
      content="{% if page.description %}{{ page.description }}{% else %}{{ page.content | strip_html | truncatewords: 50 }}{% endif %}"
    />
    <meta
      name="twitter:image"
      content="{% if page.twitter.image %}{{ page.twitter.image | absolute_url }}{% elsif page.image %}{{ page.image | absolute_url }}{% else %}{{ site.default_image | absolute_url }}{% endif %}"
    />
    <meta
      name="twitter:image:alt"
      content="{% if page.image_alt %}{{ page.image_alt }}{% else %}{{ page.title }}{% endif %}"
    />
  </head>
  <body>
    <nav>{% include nav.html %}</nav>
    <div class="wrapper">
      <main>{{ content }}</main>
      {% include footer.html %}
    </div>

    {% include link-previews.html wrapperQuerySelector="main" %}
  </body>
</html>
