---
layout: default
---

<article>
  <h1>{{ page.title }}</h1>
  {% if page.type != 'pages' %}
  <time datetime="{{ page.last_modified_at | date_to_xmlschema }}">
    {{ page.last_modified_at | date: "%B %-d, %Y" }}
  </time>
  {% endif %}

  <div id="notes-entry-container">{{ content }}</div>
</article>

<details class="graph-toggle">
  <summary>See how this connects to everything else</summary>
  {% include notes_graph.html %}
</details>
